{% block head %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dashboard - Pharmacy Management{% endblock %}</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
/* Sidebar */
.sidebar {
    width: 220px;
    position: fixed;
    top: 0; left: 0;
    height: 100%;
    background: #343a40;
    color: #fff;
    padding-top: 60px;
    transition: all 0.3s;
    z-index: 1000;
}
.sidebar a {
    color: #fff;
    display: block;
    padding: 12px;
    text-decoration: none;
}
.sidebar a:hover {
    background-color: #495057;
}
.sidebar.active {
    margin-left: -220px;
}

/* Navbar */
.navbar-custom {
    background-color: #4CAF50;
    padding: 10px 20px;
    color: #fff;
    position: fixed;
    top: 0;
    left: 220px;
    right: 0;
    z-index: 1001;
    transition: all 0.3s;
}
.navbar-custom .toggle-btn {
    display: none;
}

/* Main Content */
.main-content {
    margin-left: 220px;
    padding: 80px 20px 20px 20px;
    transition: all 0.3s;
}
.main-content.expanded {
    margin-left: 0;
}

/* Dashboard Cards */
.dash-card {
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    padding: 15px;
    margin-bottom: 20px;
    transition: all 0.3s;
    text-align: center;
}
.dash-card i {
    font-size: 2.2rem;
}
.dash-card h5 {
    margin: 0;
}

/* Table hover */
.table-hover tbody tr:hover {
    background-color: rgba(0,0,0,0.05);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .sidebar { margin-left: -220px; }
    .navbar-custom .toggle-btn { display: inline-block; cursor: pointer; }
    .main-content { margin-left: 0; padding-top: 120px; }
    .dash-card { margin-bottom: 15px; }
}
</style>
{% endblock %}
